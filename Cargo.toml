[workspace]
resolver = "2"
members = [
    "crates/zsdesk-core",
    "crates/zsdesk-platform",
    "crates/zsdesk-app",
    "crates/zsdesk-ui",
    "crates/zsdesk-windows",
    "crates/zsdesk-plugin",
]

[workspace.package]
version = "0.3.5"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"
