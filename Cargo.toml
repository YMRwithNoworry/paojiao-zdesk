[workspace]
resolver = "2"
members = [
    "crates/zsdesk-core",
    "crates/zsdesk-platform",
    "crates/zsdesk-app",
    "crates/zsdesk-ui",
    "crates/zsdesk-windows",
    "crates/zsdesk-plugin",
]

[workspace.package]
version = "0.4.7"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"

# Size-oriented code generation for Win32 integration. Search matching retains
# the workspace release optimization level.
[profile.release.package.zsdesk-windows]
opt-level = "s"

[profile.release.package.zsdesk-ui]
opt-level = "s"

[profile.release.package.zsui]
opt-level = "s"

# Keep the search engine at -O3. A single application codegen unit allows
# the optimizer to share more code across the window and command handlers.
[profile.release.package.zsdesk-app]
codegen-units = 1

# Font shaping and rasterization are reused by the ZSUI painter.
[profile.release.package.skrifa]
opt-level = "s"

[profile.release.package.harfrust]
opt-level = "s"

[profile.release.package.swash]
opt-level = "s"
